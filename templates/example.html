<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipFinder — Editor (Ejemplo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg0: #0d0d0f;
    --bg1: #141417;
    --bg2: #1c1c21;
    --bg3: #26262d;
    --border: #2e2e38;
    --text: #e8e8f0;
    --muted: #6b6b7e;
    --accent: #f5a623;
    --accent2: #e8563a;
    --green: #4caf7d;
    --blue: #4a9eff;
    --purple: #9c5fff;
    --seg-color: rgba(245,166,35,0.82);
    --seg-border: #f5a623;
    --playhead: #e8563a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
    --r: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg0); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow: hidden; }

  /* HEADER */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; background: var(--bg1);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
  .logo span { color: var(--accent); }
  .badge {
    font-family: var(--mono); font-size: 10px;
    background: var(--bg3); color: var(--muted);
    padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--border); letter-spacing: 1px; text-transform: uppercase;
  }

  /* MISC */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: var(--r);
    font-family: var(--sans); font-weight: 700; font-size: 13px;
    cursor: pointer; border: none; transition: all .15s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #ffc040; transform: translateY(-1px); }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-danger:hover { opacity: .85; }
  .btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

  /* EDITOR LAYOUT */
  #editor { display: flex; flex-direction: column; height: calc(100vh - 53px); }
  #video-area {
    background: #000; display: flex; align-items: center; justify-content: center;
    flex: 1 1 0; min-height: 120px; overflow: hidden;
  }
  #main-video { max-width: 100%; max-height: 100%; display: block; outline: none; }

  /* Resize handle */
  #resize-bar-h {
    flex: 0 0 6px;
    background: var(--bg3);
    cursor: ns-resize;
    transition: background .15s;
    position: relative;
    z-index: 5;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  #resize-bar-h:hover, #resize-bar-h.dragging { background: var(--accent); }
  #resize-bar-h::after {
    content: '···';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px; color: var(--muted); letter-spacing: 2px;
  }

  /* Bottom panel */
  #bottom-panel {
    background: var(--bg1);
    display: flex; flex-direction: column;
    height: 420px; min-height: 200px;
  }

  /* Transport */
  #transport {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid var(--border); background: var(--bg1);
    flex-shrink: 0;
  }
  .transport-btn {
    background: none; border: none; color: var(--text); font-size: 17px;
    cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background .15s; line-height: 1;
  }
  .transport-btn:hover { background: var(--bg3); }
  #timecode { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 1px; min-width: 140px; }
  .spacer { flex: 1; }

  #audio-badge {
    font-family: var(--mono); font-size: 10px; color: var(--green);
    background: rgba(76,175,125,.1); border: 1px solid rgba(76,175,125,.25);
    padding: 3px 8px; border-radius: 20px; white-space: nowrap;
  }

  /* TIMELINE AREA */
  #timeline-area {
    display: flex; flex: 1 1 0; overflow: hidden; min-height: 100px;
  }
  #timeline-wrap {
    display: flex; flex-direction: column;
    flex: 1 1 0; overflow: hidden; min-width: 0;
  }
  #timeline-zoom-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 16px; flex-shrink: 0;
  }
  #timeline-zoom-row .zoom-label {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    min-width: 36px; text-align: right;
  }
  .zoom-btn {
    width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
    font-family: var(--mono); line-height: 1;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  .zoom-btn:active { background: var(--bg3); }

  /* Track labels + tracks row */
  #timeline-body {
    display: flex; flex: 1 1 0; overflow: hidden;
  }

  /* Track labels sidebar */
  #track-labels {
    width: 140px; flex-shrink: 0;
    background: var(--bg1);
    border-right: 1px solid var(--border);
    overflow-y: hidden;
  }
  .tl-label {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; height: 36px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .15s, color .15s;
    white-space: nowrap; overflow: hidden;
  }
  .tl-label:hover { background: var(--bg3); }
  .tl-label.active { color: var(--text); }
  .tl-label-header {
    height: 24px; padding: 0;
    border-bottom: 1px solid var(--border);
  }
  .tl-label-segments {
    height: 80px; font-weight: 600; color: var(--accent);
  }
  .tl-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .tl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tl-info {
    font-size: 9px; opacity: .55; margin-left: 2px; flex-shrink: 0;
  }

  /* Scrollable tracks area */
  #tracks-scroll {
    flex: 1; overflow-x: auto; overflow-y: hidden;
  }
  #timeline-inner {
    position: relative; min-width: 100%;
  }
  #timeline-ruler { height: 24px; position: relative; pointer-events: none; }
  .ruler-tick {
    position: absolute; top: 0; font-family: var(--mono); font-size: 10px;
    color: var(--muted); transform: translateX(-50%); white-space: nowrap;
  }
  .ruler-tick::before {
    content:''; display: block; width: 1px; height: 6px;
    background: var(--border); margin: 0 auto 2px;
  }

  /* Track rows */
  .track-row {
    position: relative; height: 36px;
    border-bottom: 1px solid var(--border);
    overflow: hidden; background: var(--bg2);
  }
  .track-row-segments {
    height: 80px; background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    cursor: crosshair; user-select: none;
  }
  .waveform-canvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
  }

  /* Playhead */
  #playhead {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--playhead); z-index: 10; pointer-events: none;
  }
  #playhead::before {
    content:''; position: absolute; top: 0; left: -5px;
    width: 12px; height: 12px; background: var(--playhead);
    clip-path: polygon(0 0,100% 0,50% 100%);
  }

  /* Timeline segments */
  .timeline-seg {
    position: absolute; top: 6px; bottom: 6px;
    background: var(--seg-color); border: 1px solid var(--seg-border);
    border-radius: 4px; cursor: grab;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: box-shadow .15s;
    z-index: 3;
  }
  .timeline-seg:hover { box-shadow: 0 0 0 2px var(--accent); }
  .timeline-seg.active { box-shadow: 0 0 0 2px #fff; }
  .timeline-seg-label {
    font-family: var(--mono); font-size: 10px; font-weight: 700; color: #000;
    pointer-events: none; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg-handle {
    position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize;
    background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; z-index: 4;
  }
  .seg-handle::after { content:'|||'; font-size: 8px; color: rgba(0,0,0,.6); letter-spacing: -1px; }
  .seg-handle.left { left: 0; border-radius: 4px 0 0 4px; }
  .seg-handle.right { right: 0; border-radius: 0 4px 4px 0; }

  /* Segment list */
  #seg-panel {
    width: 280px; flex-shrink: 0;
    background: var(--bg1); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .seg-panel-title { font-size: 10px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 7px; padding: 10px 12px 0; }
  #seg-list { display: flex; flex-direction: column; gap: 4px; padding: 4px 12px 12px; overflow-y: auto; flex: 1; }
  .seg-row {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--r); font-family: var(--mono); font-size: 11px;
    cursor: pointer; transition: border-color .15s;
  }
  .seg-row:hover { border-color: var(--accent); }
  .seg-row.active { border-color: var(--accent); background: rgba(245,166,35,.08); }
  .seg-num { color: var(--accent); font-weight: 700; min-width: 18px; }
  .seg-time { color: var(--text); white-space: nowrap; }
  .seg-sep { color: var(--muted); }
  .seg-text { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .seg-conf { font-size: 9px; color: var(--green); white-space: nowrap; }
  .seg-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; border-radius: 3px; transition: color .15s; line-height: 1; }
  .seg-del:hover { color: var(--accent2); }
  .empty-state { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; font-family: var(--mono); }
  .empty-state .icon { font-size: 28px; margin-bottom: 8px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 18px; border-radius: var(--r);
    font-family: var(--mono); font-size: 13px; z-index: 1000;
    opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--green); color: var(--green); }
  #toast.error { border-color: var(--accent2); color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="logo">Clip<span>Finder</span></div>
  <div class="badge">Ejemplo · Editor</div>
  <div style="margin-left:auto">
    <button class="btn btn-ghost btn-sm" onclick="resetExample()">↩ Reiniciar</button>
    <button class="btn btn-ghost btn-sm" onclick="addMoreSegments()">+ Segmentos</button>
  </div>
</header>

<div id="editor">
  <div id="video-area">
    <video id="main-video" controls preload="metadata">
      Tu navegador no soporta este formato de video.
    </video>
  </div>

  <div id="resize-bar-h"></div>

  <div id="bottom-panel">
    <div id="transport">
      <button class="transport-btn" onclick="skipVideo(-10)" title="-10s">⏮</button>
      <button class="transport-btn" onclick="skipVideo(-1)">◂</button>
      <button class="transport-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="transport-btn" onclick="skipVideo(1)">▸</button>
      <button class="transport-btn" onclick="skipVideo(10)" title="+10s">⏭</button>
      <div id="timecode">00:00:00 / 00:00:00</div>
      <div id="audio-badge">🎧 pista #0 · eng</div>
      <div class="spacer"></div>
      <div style="display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted)">
        <span>Padding:</span>
        <label style="display:flex;align-items:center;gap:2px">↑<input type="number" id="pad-before" value="2" min="0" max="60" step="0.5" style="width:40px;background:var(--bg0);border:1px solid var(--border);color:var(--text);padding:3px 4px;border-radius:4px;font-family:var(--mono);font-size:11px;text-align:center">s</label>
        <label style="display:flex;align-items:center;gap:2px">↓<input type="number" id="pad-after" value="2" min="0" max="60" step="0.5" style="width:40px;background:var(--bg0);border:1px solid var(--border);color:var(--text);padding:3px 4px;border-radius:4px;font-family:var(--mono);font-size:11px;text-align:center">s</label>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="addManualSegment()">+ Seg aquí</button>
      <button class="btn btn-danger btn-sm" id="export-btn" onclick="toast('Exportación deshabilitada en modo ejemplo', 'error')">⬇ Exportar</button>
    </div>

    <div id="timeline-area">
      <div id="timeline-wrap">
        <div id="timeline-zoom-row">
          <button class="zoom-btn" onclick="zoomTimeline(-1)" title="Alejar">−</button>
          <span class="zoom-label" id="zoom-label">1×</span>
          <button class="zoom-btn" onclick="zoomTimeline(1)" title="Acercar">+</button>
          <button class="zoom-btn" onclick="zoomTimeline(0)" title="Restablecer" style="font-size:12px">↺</button>
          <div class="spacer"></div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">Scroll = zoom · Arrastrar cuadro = mover</span>
        </div>

        <div id="timeline-body">
          <div id="track-labels">
            <div class="tl-label tl-label-header"></div>
          </div>
          <div id="tracks-scroll">
            <div id="timeline-inner">
              <div id="timeline-ruler"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="seg-panel">
        <div class="seg-panel-title">Segmentos</div>
        <div id="seg-list">
          <div class="empty-state"><div class="icon">🎞</div>Sin segmentos</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const MOCK_DURATION = 840;
const MOCK_SEGMENTS = [
  { start: 42.5, end: 73.2, text: 'Y fue entonces cuando todo cambió de repente sin previo aviso', confidence: 94 },
  { start: 185.0, end: 218.6, text: 'No te das cuenta de lo que tienes hasta que lo pierdes completamente', confidence: 88 },
  { start: 450.3, end: 491.7, text: 'La vida es un misterio que nadie puede resolver del todo', confidence: 91 },
  { start: 620.0, end: 655.4, text: 'Cada día es una nueva oportunidad para empezar de cero otra vez', confidence: 79 },
  { start: 720.8, end: 755.1, text: 'Y así terminó la historia que nunca debió comenzar en primer lugar', confidence: 85 },
];

const MOCK_TRACKS = [
  { id: 0, name: 'Inglés', lang: 'eng', color: '#4a9eff', channels: '5.1', default: true },
  { id: 1, name: 'Español', lang: 'spa', color: '#4caf7d', channels: '2.0', default: false },
  { id: 2, name: 'Comentario', lang: 'eng', color: '#9c5fff', channels: '2.0', default: false },
];

const SAMPLE_VIDEO = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
const TRACK_ROW_H = 36;
const SEGMENTS_ROW_H = 80;
const MIN_BOTTOM = 200;
const MIN_VIDEO = 100;

let segments = [];
let activeSegIdx = -1;
let selectedTrackId = 0;
let videoDuration = MOCK_DURATION;
let isDragging = false;
let isResizing = false;
let resizeStartY = 0;
let resizeStartHeight = 0;
let zoomLevel = 1;
const MIN_ZOOM = 1;
const MAX_ZOOM = 32;
const ZOOM_STEPS = [1, 2, 4, 6, 8, 12, 16, 24, 32];

const video = document.getElementById('main-video');

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 11) % 2147483647; return (s - 1) / 2147483646; };
}

function fmt(s) {
  if (!isFinite(s)) return '00:00:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':');
}
function fmtShort(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3500);
}

// ── INIT ──
function initExample() {
  segments = JSON.parse(JSON.stringify(MOCK_SEGMENTS));
  activeSegIdx = -1;
  selectedTrackId = 0;
  zoomLevel = 1;

  buildTrackLabels();
  buildTrackRows();
  initResizeHandle();

  video.src = SAMPLE_VIDEO;
  video.addEventListener('loadedmetadata', () => {
    if (isFinite(video.duration) && video.duration > 0) {
      videoDuration = video.duration;
    } else {
      videoDuration = MOCK_DURATION;
    }
    buildRuler(); renderWaveforms(); renderTimeline(); renderSegList(); updateAudioBadge();
  }, {once: true});

  video.addEventListener('timeupdate', onTimeUpdate);
  if (!navigator.onLine) {
    videoDuration = MOCK_DURATION;
    buildRuler(); renderWaveforms(); renderTimeline(); renderSegList(); updateAudioBadge();
  }
}

// ── TRACK LABELS ──
function buildTrackLabels() {
  const container = document.getElementById('track-labels');
  container.innerHTML = '<div class="tl-label tl-label-header"></div>';

  MOCK_TRACKS.forEach(track => {
    const label = document.createElement('div');
    label.className = 'tl-label' + (track.id === selectedTrackId ? ' active' : '');
    label.dataset.trackId = track.id;
    label.innerHTML = `
      <span class="tl-dot" style="background:${track.color}"></span>
      <span class="tl-name">${track.name}</span>
      <span class="tl-info">${track.channels}</span>
    `;
    label.addEventListener('click', () => selectTrack(track.id));
    container.appendChild(label);
  });

  const segLabel = document.createElement('div');
  segLabel.className = 'tl-label tl-label-segments';
  segLabel.innerHTML = '<span style="font-size:13px">✂</span><span class="tl-name">Segmentos</span>';
  container.appendChild(segLabel);
}

function selectTrack(id) {
  selectedTrackId = id;
  document.querySelectorAll('.tl-label[data-track-id]').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.trackId) === id);
  });
  document.querySelectorAll('.track-row').forEach(el => {
    el.classList.toggle('track-row-active', parseInt(el.dataset.track) === id);
  });
  updateAudioBadge();
}

function updateAudioBadge() {
  const track = MOCK_TRACKS.find(t => t.id === selectedTrackId) || MOCK_TRACKS[0];
  document.getElementById('audio-badge').textContent =
    `🎧 #${track.id} · ${track.lang} · ${track.channels}`;
}

// ── TRACK ROWS ──
function buildTrackRows() {
  const inner = document.getElementById('timeline-inner');

  MOCK_TRACKS.forEach(track => {
    const row = document.createElement('div');
    row.className = 'track-row' + (track.id === selectedTrackId ? ' track-row-active' : '');
    row.dataset.track = track.id;
    row.style.height = TRACK_ROW_H + 'px';
    row.style.position = 'relative';
    row.style.overflow = 'hidden';

    const canvas = document.createElement('canvas');
    canvas.className = 'waveform-canvas';
    canvas.dataset.trackId = track.id;
    row.appendChild(canvas);
    inner.appendChild(row);
  });

  const segTrack = document.createElement('div');
  segTrack.id = 'segments-track';
  segTrack.className = 'track-row track-row-segments';
  segTrack.style.height = SEGMENTS_ROW_H + 'px';
  segTrack.addEventListener('click', onSegmentsTrackClick);
  inner.appendChild(segTrack);

  const playhead = document.createElement('div');
  playhead.id = 'playhead';
  playhead.style.left = '0';
  inner.appendChild(playhead);
}

function onSegmentsTrackClick(e) {
  if (isDragging) return;
  const inner = document.getElementById('timeline-inner');
  const rect = inner.getBoundingClientRect();
  video.currentTime = Math.max(0, Math.min(videoDuration, ((e.clientX - rect.left) / inner.offsetWidth) * videoDuration));
}

// ── WAVEFORM RENDERING ──
function renderWaveforms() {
  const innerWidth = getTrackWidth();
  if (!innerWidth) return;

  document.querySelectorAll('.waveform-canvas').forEach(canvas => {
    const trackId = parseInt(canvas.dataset.trackId);
    const track = MOCK_TRACKS.find(t => t.id === trackId);
    if (!track) return;

    const row = canvas.closest('.track-row');
    const h = TRACK_ROW_H;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = h + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, innerWidth, h);

    const rng = seededRandom(trackId * 1337 + 42);
    const barW = 2;
    const gap = 4;
    const numBars = Math.ceil(innerWidth / (barW + gap));

    for (let b = 0; b < numBars; b++) {
      const amp = rng() * 0.65 + 0.15;
      const barH = amp * (h - 8);
      ctx.fillStyle = track.color;
      ctx.globalAlpha = track.id === selectedTrackId ? 0.55 : 0.25;
      ctx.fillRect(b * (barW + gap), (h - barH) / 2, barW, barH);
    }
  });
}

// ── RESIZE HANDLE ──
function initResizeHandle() {
  const bar = document.getElementById('resize-bar-h');
  const bottomPanel = document.getElementById('bottom-panel');

  bar.addEventListener('mousedown', e => {
    e.preventDefault();
    isDragging = false;
    isResizing = true;
    resizeStartY = e.clientY;
    resizeStartHeight = bottomPanel.offsetHeight;
    bar.classList.add('dragging');
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';

    const onMove = ev => {
      const dy = ev.clientY - resizeStartY;
      const newH = Math.max(MIN_BOTTOM, Math.min(window.innerHeight - 53 - MIN_VIDEO, resizeStartHeight - dy));
      bottomPanel.style.height = newH + 'px';
    };
    const onUp = () => {
      isResizing = false;
      bar.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      renderWaveforms();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── VIDEO CONTROLS ──
function onTimeUpdate() {
  document.getElementById('timecode').textContent =
    `${fmt(video.currentTime)} / ${fmt(videoDuration)}`;
  if (videoDuration > 0) {
    const pct = (video.currentTime / videoDuration) * 100;
    document.getElementById('playhead').style.left = pct + '%';
  }
}

function togglePlay() {
  if (video.paused) video.play(); else video.pause();
}
video.addEventListener('play', () => document.getElementById('play-btn').textContent = '⏸');
video.addEventListener('pause', () => document.getElementById('play-btn').textContent = '▶');

function skipVideo(s) {
  video.currentTime = Math.max(0, Math.min(videoDuration, video.currentTime + s));
}

// ── RULER ──
function getTrackWidth() {
  const scroll = document.getElementById('tracks-scroll');
  return (scroll ? scroll.clientWidth - 16 : 800) * zoomLevel;
}

function buildRuler() {
  const ruler = document.getElementById('timeline-ruler');
  ruler.innerHTML = '';
  if (!videoDuration) return;
  const trackW = getTrackWidth();
  const inner = document.getElementById('timeline-inner');
  inner.style.width = trackW + 'px';
  const intervals = [1,2,5,10,15,30,60,120,300,600];
  const tickEvery = intervals.find(i => (i/videoDuration)*trackW >= 45) || 600;
  for (let t = 0; t <= videoDuration; t += tickEvery) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = (t/videoDuration*100) + '%';
    tick.textContent = fmtShort(t);
    ruler.appendChild(tick);
  }
}

// ── ZOOM ──
function zoomTimeline(dir) {
  if (dir === 0) {
    zoomLevel = 1;
  } else {
    const idx = ZOOM_STEPS.indexOf(zoomLevel);
    if (idx !== -1) {
      zoomLevel = ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length-1, idx + dir))];
    } else {
      let closest = ZOOM_STEPS[0];
      for (const z of ZOOM_STEPS) { if (z <= zoomLevel + dir) closest = z; }
      zoomLevel = dir > 0 ? Math.min(MAX_ZOOM, closest) : Math.max(MIN_ZOOM, closest);
    }
  }
  document.getElementById('zoom-label').textContent = zoomLevel + '×';
  buildRuler(); renderWaveforms(); renderTimeline(); renderSegList();
  scrollToPlayhead();
}

function scrollToPlayhead() {
  const scroll = document.getElementById('tracks-scroll');
  const inner = document.getElementById('timeline-inner');
  if (!scroll || !inner || !videoDuration) return;
  const px = (video.currentTime / videoDuration) * inner.offsetWidth;
  scroll.scrollLeft = px - scroll.clientWidth / 2;
}

// ── TIMELINE SEGMENTS ──
function renderTimeline() {
  const track = document.getElementById('segments-track');
  if (!track) return;
  track.querySelectorAll('.timeline-seg').forEach(el => el.remove());

  if (!videoDuration) return;

  segments.forEach((seg, idx) => {
    const leftPct = (seg.start / videoDuration) * 100;
    const widthPct = Math.max((seg.end - seg.start) / videoDuration * 100, 0.3 / zoomLevel);

    const el = document.createElement('div');
    el.className = 'timeline-seg' + (idx === activeSegIdx ? ' active' : '');
    el.style.left = leftPct + '%';
    el.style.width = widthPct + '%';
    el.dataset.idx = idx;

    const lh = document.createElement('div');
    lh.className = 'seg-handle left';
    lh.addEventListener('mousedown', e => startResize(e, idx, 'left'));

    const rh = document.createElement('div');
    rh.className = 'seg-handle right';
    rh.addEventListener('mousedown', e => startResize(e, idx, 'right'));

    const label = document.createElement('div');
    label.className = 'timeline-seg-label';
    label.textContent = `#${idx+1} ${fmtShort(seg.start)}`;

    el.appendChild(lh); el.appendChild(label); el.appendChild(rh);
    el.addEventListener('mousedown', e => { if (!e.target.classList.contains('seg-handle')) startDrag(e, idx); });
    el.addEventListener('click', e => { e.stopPropagation(); selectSeg(idx); video.currentTime = seg.start; scrollToPlayhead(); });
    track.appendChild(el);
  });
}

function startDrag(e, idx) {
  e.stopPropagation(); isDragging = true;
  const inner = document.getElementById('timeline-inner');
  const dur = segments[idx].end - segments[idx].start;
  const startX = e.clientX;

  const onMove = ev => {
    const dx = ev.clientX - startX;
    const timeDelta = (dx / inner.offsetWidth) * videoDuration;
    let ns = Math.max(0, Math.min(videoDuration - dur, segments[idx].start + timeDelta));
    segments[idx].start = ns; segments[idx].end = ns + dur;
    startX = ev.clientX;
    renderTimeline(); renderSegList();
  };
  const onUp = () => { isDragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
}

function startResize(e, idx, side) {
  e.stopPropagation(); isDragging = true;
  const inner = document.getElementById('timeline-inner');

  const onMove = ev => {
    const rect = inner.getBoundingClientRect();
    const t = Math.max(0, Math.min(videoDuration, ((ev.clientX - rect.left) / inner.offsetWidth) * videoDuration));
    if (side === 'left' && t < segments[idx].end - 0.5) segments[idx].start = t;
    if (side === 'right' && t > segments[idx].start + 0.5) segments[idx].end = t;
    renderTimeline(); renderSegList();
  };
  const onUp = () => { isDragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
}

function selectSeg(idx) {
  activeSegIdx = idx;
  renderTimeline();
  document.querySelectorAll('.seg-row').forEach((r, i) => r.classList.toggle('active', i === idx));
}

// ── SEG LIST ──
function renderSegList() {
  const list = document.getElementById('seg-list');
  document.getElementById('seg-count-badge').textContent = `${segments.length} seg`;

  if (!segments.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🎞</div>Sin segmentos</div>';
    return;
  }

  list.innerHTML = '';
  segments.forEach((seg, idx) => {
    const row = document.createElement('div');
    row.className = 'seg-row' + (idx === activeSegIdx ? ' active' : '');
    row.innerHTML = `
      <span class="seg-num">#${idx+1}</span>
      <span class="seg-time">${fmt(seg.start)}</span>
      <span class="seg-sep">→</span>
      <span class="seg-time">${fmt(seg.end)}</span>
      <span class="seg-sep">(${fmtShort(seg.end - seg.start)})</span>
      <span class="seg-text">${seg.text || ''}</span>
      ${seg.confidence ? `<span class="seg-conf">↑${seg.confidence}%</span>` : ''}
      <button class="seg-del" onclick="deleteSeg(event,${idx})">✕</button>
    `;
    row.addEventListener('click', () => { selectSeg(idx); video.currentTime = seg.start; });
    list.appendChild(row);
  });
}

function deleteSeg(e, idx) {
  e.stopPropagation();
  segments.splice(idx, 1);
  if (activeSegIdx >= segments.length) activeSegIdx = segments.length - 1;
  renderTimeline(); renderSegList();
}

function addManualSegment() {
  const t = video.currentTime;
  segments.push({ start: t, end: Math.min(t + 10, videoDuration), text: 'Manual', confidence: null });
  selectSeg(segments.length - 1);
  renderTimeline(); renderSegList();
  toast('Segmento agregado — ajustá los bordes en el timeline');
}

function resetExample() {
  segments = JSON.parse(JSON.stringify(MOCK_SEGMENTS));
  activeSegIdx = -1;
  zoomLevel = 1;
  document.getElementById('zoom-label').textContent = '1×';
  buildRuler(); renderWaveforms(); renderTimeline(); renderSegList();
  toast('Ejemplo reiniciado', 'success');
}

function addMoreSegments() {
  const extras = [
    { start: 100.0 + Math.random()*50, end: 150.0 + Math.random()*30, text: 'Segmento adicional generado', confidence: 75 },
    { start: 300.0 + Math.random()*50, end: 370.0 + Math.random()*20, text: 'Otro segmento de ejemplo', confidence: 70 },
  ];
  segments.push(...extras);
  renderTimeline(); renderSegList();
  toast(`${extras.length} segmentos agregados`);
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') skipVideo(e.shiftKey ? -10 : -1);
  if (e.code === 'ArrowRight') skipVideo(e.shiftKey ? 10 : 1);
  if (e.code === 'KeyA') addManualSegment();
  if (e.code === 'Delete' && activeSegIdx >= 0) deleteSeg({stopPropagation:()=>{}}, activeSegIdx);
  if (e.code === 'Equal' || e.code === 'NumpadAdd') { e.preventDefault(); zoomTimeline(1); }
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') { e.preventDefault(); zoomTimeline(-1); }
  if (e.code === 'Digit0') { e.preventDefault(); zoomTimeline(0); }
});

window.addEventListener('resize', () => {
  if (videoDuration) {
    buildRuler(); renderWaveforms(); renderTimeline();
  }
});

document.getElementById('tracks-scroll').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    zoomTimeline(dir);
  }
}, {passive: false});

initExample();
</script>
</body>
</html>
